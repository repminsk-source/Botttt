services:
  - type: worker
    name: vpi-gavan-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: gavan.db
      # Short gameplay cooldowns; these prevent stale Render values such as 43200 seconds.
      - key: ACTION_COOLDOWN_SECONDS
        value: "600"
      - key: ATTACK_COOLDOWN_SECONDS
        value: "3600"
      - key: COLLECT_COOLDOWN_SECONDS
        value: "2700"
      - key: BUILD_COOLDOWN_SECONDS
        value: "60"
      - key: UPGRADE_COOLDOWN_SECONDS
        value: "600"
      - key: MOBILIZE_COOLDOWN_SECONDS
        value: "600"
      - key: BUY_COOLDOWN_SECONDS
        value: "60"
      - key: BASE_COOLDOWN_SECONDS
        value: "600"
      - key: POLICY_COOLDOWN_SECONDS
        value: "1800"
      - key: SPY_COOLDOWN_SECONDS
        value: "900"
      - key: NUKE_COOLDOWN_SECONDS
        value: "3600"
      # Ollama Cloud is reachable from Render; create the key at ollama.com/settings/keys.
      - key: AI_PROVIDER
        value: "ollama"
      - key: OLLAMA_ENABLED
        value: "1"
      - key: OLLAMA_BASE_URL
        value: "https://ollama.com/v1"
      - key: OLLAMA_MODEL
        value: "gpt-oss:20b-cloud"
      - key: OLLAMA_API_KEY
        sync: false
    # SQLite on Render Free is not persistent across restarts or redeploys.
    # Use a persistent disk or external Postgres for production data durability.
