services:
  - type: worker
    name: vpi-gavan-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: gavan.db
      # Short gameplay cooldowns; these prevent stale Render values such as 43200 seconds.
      - key: ACTION_COOLDOWN_SECONDS
        value: "600"
      - key: ATTACK_COOLDOWN_SECONDS
        value: "3600"
      - key: COLLECT_COOLDOWN_SECONDS
        value: "2700"
      - key: BUILD_COOLDOWN_SECONDS
        value: "60"
      - key: UPGRADE_COOLDOWN_SECONDS
        value: "600"
      - key: MOBILIZE_COOLDOWN_SECONDS
        value: "600"
      - key: BUY_COOLDOWN_SECONDS
        value: "60"
      - key: BASE_COOLDOWN_SECONDS
        value: "600"
      - key: POLICY_COOLDOWN_SECONDS
        value: "1800"
      - key: SPY_COOLDOWN_SECONDS
        value: "900"
      - key: NUKE_COOLDOWN_SECONDS
        value: "3600"
      # Keep disabled unless Ollama is hosted at a URL reachable by this Render Worker.
      - key: OLLAMA_ENABLED
        value: "0"
      - key: OLLAMA_BASE_URL
        value: "http://127.0.0.1:11434/v1"
      - key: OLLAMA_MODEL
        value: "llama3.2"
      - key: OLLAMA_API_KEY
        value: "ollama-local"
    # SQLite on Render Free is not persistent across restarts or redeploys.
    # Use a persistent disk or external Postgres for production data durability.
